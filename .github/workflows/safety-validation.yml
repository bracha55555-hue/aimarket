name: AI Market safety validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [safety/honest-settlement-20261025]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Ensure no false receipts
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text()
          assert '"event": "payment_received"' not in s
          assert '"event": "trade_settled"' not in s
          assert 'payment_verified": False' in s
          assert 'ENABLE_INTERNAL_DEMO_AGENTS' in s
          assert s.count('0xE0c20F6E0f3cb12195F86a18Eab44c75c5B8f3d5') == 2
          print("Safety invariants pass")
          PY