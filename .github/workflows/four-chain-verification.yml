name: Verify four-chain market restoration
on:
  push:
    branches: [payments/restore-sol-trx-20261026]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt httpx
      - run: python -m py_compile app.py
      - name: SOL and TRX order safety and payment confirmation (mocked chains, zero transfers)
        run: |
          python - <<'PY'
          import ast, json
          import app as m
          from fastapi.testclient import TestClient
          from eth_account import Account
          from eth_account.messages import encode_defunct
          from solders.pubkey import Pubkey
          from tronpy.keys import PrivateKey
          payer=Account.create();seller=Account.create()
          psol=str(Pubkey.new_unique());ssol=str(Pubkey.new_unique())
          tpk=PrivateKey.random()
          tpk2=PrivateKey.random()
          ptrx=tpk.public_key.to_base58check_address()
          strx=tpk2.public_key.to_base58check_address()
          def invoice(currency, payer_address, seller_address, units):
              init=m.AltInvoice(currency=currency,order_id='a'*32,buyer=payer.address.lower(),
                  seller=seller.address.lower(),payer_address=payer_address,
                  seller_payout_address=seller_address,amount_units=units,seller_signature='pending')
              signature=Account.sign_message(encode_defunct(text=m.alt_invoice_message(init)),seller.key).signature.hex()
              return m.AltInvoice(**{**init.model_dump(),'seller_signature':signature})
          sol=invoice('SOL',psol,ssol,10_000_000)
          trx=invoice('TRX',ptrx,strx,3_000_000)
          sol_quote=m.alt_invoice_quote(sol);trx_quote=m.alt_invoice_quote(trx)
          assert sol_quote['atomic'] is True and sol_quote['fee_units']==200000
          assert trx_quote['atomic'] is False and trx_quote['fee_units']==60000
          assert m.FEE_WALLETS['SOL']==sol_quote['outputs'][1]['to']
          assert m.FEE_WALLETS['TRX']==trx_quote['outputs'][1]['to']
          changed=sol.model_dump();changed['amount_units']+=1
          try: m.alt_invoice_quote(m.AltInvoice(**changed));assert False
          except ValueError: pass
          original=m.rpc_json
          mock_sol={
              'result':{'meta':{'err':None},'transaction':{'message':{
                  'accountKeys':[{'pubkey':psol,'signer':True}],
                  'instructions':[
                      {'program':'system','parsed':{'type':'transfer','info':{'source':psol,'destination':ssol,'lamports':9800000}}},
                      {'program':'system','parsed':{'type':'transfer','info':{'source':psol,'destination':m.FEE_WALLETS['SOL'],'lamports':200000}}},
                      {'program':'spl-memo','parsed':sol_quote['memo']}
                  ]
              }}}}
          }
          signature=str(Pubkey.new_unique())
          proof_sol=m.AltProof(**sol.model_dump(),signature=signature)
          m.rpc_json=lambda *_: mock_sol
          assert m.verify_solana_payment(proof_sol)['payment_verified'] is True
          mock_sol['result']['transaction']['message']['instructions'][1]['parsed']['info']['lamports']=199999
          assert not m.verify_solana_payment(proof_sol)['payment_verified']
          mock_sol['result']['transaction']['message']['instructions'][1]['parsed']['info']['lamports']=200000
          mock_sol['result']['meta']['err']={'InstructionError':[0,'Failed']}
          assert not m.verify_solana_payment(proof_sol)['payment_verified']
          def trx_mock(url,payload):
              is_seller=payload['value']=='b'*64
              to=strx if is_seller else m.FEE_WALLETS['TRX']
              amount=2940000 if is_seller else 60000
              return {'txID':payload['value'], 'ret':[{'contractRet':'SUCCESS'}],
                  'raw_data':{'data':trx_quote['memo'].encode().hex(),
                    'contract':[{'type':'TransferContract','parameter':{'value':{
                      'owner_address':m.tron_to_hex_address(ptrx),'to_address':m.tron_to_hex_address(to),
                      'amount':amount
                  }}}]}}
          m.rpc_json=trx_mock
          proof_trx=m.AltProof(**trx.model_dump(),seller_tx='b'*64,fee_tx='c'*64)
          assert m.verify_tron_payment(proof_trx)['payment_verified'] is True
          def wrong_fee(url,payload):
              v=trx_mock(url,payload)
              if payload['value']=='c'*64: v['raw_data']['contract'][0]['parameter']['value']['amount']=59999
              return v
          m.rpc_json=wrong_fee
          assert not m.verify_tron_payment(proof_trx)['payment_verified']
          m.rpc_json=original
          with TestClient(m.app) as client:
              assert client.get('/health').json()['native_sol_trx_quote'] is True
              for invoice_obj in (sol,trx):
                  quote=client.post('/api/payments/native/quote',json=invoice_obj.model_dump())
                  assert quote.status_code==200,quote.text
                  assert quote.json()['status']=='wallet_signature_required'
              client_file=client.get('/client/native-agent.py')
              assert client_file.status_code==200
              ast.parse(client_file.text)
              assert 'AIMARKET_SOL_BUYER_KEY' in client_file.text and 'AIMARKET_TRX_BUYER_KEY' in client_file.text
              assert client.get('/health').json()['verified_settlement'] is False
          print('PASS SOL atomic, TRX solidified dual transfers, invalid proofs, client syntax')
          PY
