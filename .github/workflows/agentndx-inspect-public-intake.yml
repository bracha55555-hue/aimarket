name: Inspect AgentNDX public submission form once
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agentndx-inspect-public-intake.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'growth/agentndx-one-real-listing-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public submission field names without submitting or posting
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          class Forms(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms=[]
                  self.current=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="form":
                      self.current={"action":a.get("action",""),"method":a.get("method","GET"),"fields":[]}
                      self.forms.append(self.current)
                  if self.current is not None and tag in ("input","textarea","select","button"):
                      self.current["fields"].append({"tag":tag,"name":a.get("name",""),"type":a.get("type",""),"required":"required" in a})
              def handle_endtag(self,tag):
                  if tag=="form":self.current=None
          req=Request("https://agentndx.ai/submit/",headers={"User-Agent":"AI-Market-Directory-Form-Spec-Read-Only/1.0"})
          with urlopen(req,timeout=18) as response:
              raw=response.read(180000)
              print("FORM_GET_STATUS",response.status)
              print("FORM_RESOLVED_URL",response.url)
          forms=Forms()
          forms.feed(raw.decode("utf-8","replace"))
          print("VISIBLE_FORMS",forms.forms[:5])
          import re
          source=raw.decode("utf-8","replace")
          for item in re.findall(r'<script[^>]*src=["\\']([^"\\']+)["\\']',source,re.I)[:12]:
              print("PUBLIC_SCRIPT_SRC",item[:190])
          for pattern in (r"fetch\\s*\\(",r"api/submit",r"submitForm",r"addEventListener\\s*\\("):
              for m in list(re.finditer(pattern,source,re.I))[:8]:
                  print("PUBLIC_SUBMIT_JS_CONTEXT",source[max(0,m.start()-200):m.end()+260].replace("\\n"," ")[:600])

          print("NO_POST_NO_CREDENTIALS_NO_MARKETING_SUBMISSION")
          PY
