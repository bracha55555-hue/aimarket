name: One-time genuine AI Market listing in AgentBazaar
on:
  push:
    branches: [main]
    paths: [.github/workflows/agentbazaar-organic-once-20261105.yml]
permissions:
  contents: read
jobs:
  list_actual_a2a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed public A2A and submit one free directory listing
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          host="https://aimarket-997u.onrender.com"
          directory="https://agentbazaar.tech"
          card_url=host+"/.well-known/agent-card.json"
          ua="AI-Market-Owner-Verified-Directory-Listing/1.0"
          def get(url,limit=1000000):
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":ua})
              with urllib.request.urlopen(req,timeout=30) as response:
                  if response.status!=200:raise ValueError("public GET failed")
                  body=response.read(limit+1)
              if len(body)>limit:raise ValueError("oversized public result")
              return json.loads(body)
          for attempt in range(38):
              try:
                  health=get(host+"/health")
                  card=get(card_url)
                  if health.get("status")!="online" or health.get("deployed_git_sha")!=os.environ["EXPECTED_SHA"]:
                      raise ValueError("different deploy")
                  interfaces=card.get("supportedInterfaces",[])
                  if not any(isinstance(x,dict) and x.get("protocolBinding")=="JSONRPC" and
                      x.get("protocolVersion")=="1.0" and x.get("url")==host+"/a2a"
                      for x in interfaces):
                      raise ValueError("unsupported live A2A interface")
                  if card.get("capabilities",{}).get("streaming") is not False:
                      raise ValueError("unverified streaming claim")
                  print("EXACT_LIVE_A2A_CONFIRMED",os.environ["EXPECTED_SHA"])
                  break
              except (ValueError,KeyError,TypeError,OSError,TimeoutError) as error:
                  print("AWAIT_DEPLOYED_A2A",attempt+1,type(error).__name__)
                  if attempt==37:raise
                  time.sleep(8)
          public=get(directory+"/explore/agents.json")
          agents=public.get("agents",[]) if isinstance(public,dict) else []
          if not isinstance(agents,list):raise ValueError("public index malformed")
          def existing(entry):
              if not isinstance(entry,dict):return False
              name=entry.get("name","")
              if isinstance(name,str) and name.strip().casefold() in ("ai market","ai market discovery"):
                  return True
              return "aimarket-997u.onrender.com" in json.dumps(entry).lower()
          if any(existing(a) for a in agents):
              print("AGENTBAZAAR_ALREADY_IN_PUBLIC_DIRECTORY_NO_DUPLICATE")
              raise SystemExit(0)
          payload=json.dumps({"agent_card_url":card_url},separators=(",",":")).encode()
          request=urllib.request.Request(directory+"/v1/sell",method="POST",data=payload,headers={
              "User-Agent":ua,"Accept":"application/json","Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(request,timeout=45) as response:
                  status=response.status
                  raw=response.read(150001)
          except urllib.error.HTTPError as error:
              status=error.code
              raw=b""
          print("AGENTBAZAAR_FIRST_SUBMISSION_HTTP",status)
          if status==409:
              print("Directory reports prior registration; no repeat request.")
              raise SystemExit(0)
          if status not in (200,201,202) or len(raw)>150000:
              raise RuntimeError("Directory did not accept registration")
          result=json.loads(raw)
          if not isinstance(result,dict) or result.get("error"):
              raise RuntimeError("Directory returned an invalid registration response")
          agent=result.get("agent")
          ident=result.get("agent_id") or result.get("id")
          if not ident and isinstance(agent,dict):ident=agent.get("id")
          if isinstance(ident,str) and ident.startswith("ag_") and len(ident)<80:
              print("AGENTBAZAAR_NONSECRET_AGENT_ID",ident)
          print("Listing submitted once. Indexing, real traffic and commerce unverified.")
          print("Any returned API key is intentionally not logged; no funds or keys transmitted.")
          PY
