name: Verify portable AI Market Skill with official Skills CLI
on:
  pull_request:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - 'client/connect.html'
      - '.github/workflows/skills-cli-compat.yml'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - 'client/connect.html'
      - '.github/workflows/skills-cli-compat.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify real local Skill recognized and installed for Codex, without telemetry or paid services
        env:
          DISABLE_TELEMETRY: '1'
          CI: 'true'
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/.agents/skills/ai-market/SKILL.md"
          npx --yes skills@1.7.4 add "$GITHUB_WORKSPACE" --list 2>&1 | tee /tmp/ai-market-available.txt
          grep -q "ai-market" /tmp/ai-market-available.txt
          workspace="$(mktemp -d)"
          cd "$workspace"
          npx --yes skills@1.7.4 add "$GITHUB_WORKSPACE" --skill ai-market -a codex -y 2>&1 | tee /tmp/ai-market-install.txt
          installed="$(find -L . -name SKILL.md -type f -print | head -n 1)"
          test -n "$installed"
          cmp "$GITHUB_WORKSPACE/.agents/skills/ai-market/SKILL.md" "$installed"
          grep -q "name: ai-market" "$installed"
          echo "AI_MARKET_ACTUAL_LOCAL_CODEX_SKILL_INSTALL_VERIFIED=1"
