name: One-time AgentBazaar A2A registration after MCP-only HTTP 400
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-market-distribution.yml
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Try one documented A2A card registration only after exact live revision verification
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,re,time,urllib.error,urllib.request
          ROOT="https://aimarket-997u.onrender.com"
          CARD=ROOT+"/.well-known/agent-card.json"
          HEADERS={"User-Agent":"AI-Market-Operator-A2A-Directory/1.0 (+https://github.com/bracha55555-hue/aimarket)",
                   "Accept":"application/json"}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=HEADERS),timeout=25) as response:
                  return json.loads(response.read(500000).decode())
          for attempt in range(31):
              try:
                  health=get(ROOT+"/health")
                  if health.get("deployed_git_sha")!=os.environ["EXPECTED_SHA"]:
                      raise ValueError("production revision mismatch")
                  card=get(CARD)
                  versions={x.get("protocolVersion") for x in card.get("supportedInterfaces",[])
                            if isinstance(x,dict) and x.get("protocolBinding")=="JSONRPC" and
                            x.get("url")==ROOT+"/a2a"}
                  if not {"1.0","0.3.0"}.issubset(versions):
                      raise ValueError("A2A not independently verified")
                  if card.get("capabilities",{}).get("streaming") is not False:
                      raise ValueError("card must honestly declare no streaming")
                  print("A2A_LIVE_CARD_CONFIRMED",os.environ["EXPECTED_SHA"])
                  break
              except (urllib.error.URLError,ValueError,TimeoutError,KeyError) as exc:
                  print("WAITING_FOR_EXACT_LIVE_CARD",attempt+1,type(exc).__name__)
              if attempt==30:raise RuntimeError("No external registration: live revision not verified")
              time.sleep(8)
          catalog=get("https://agentbazaar.tech/explore/agents.json")
          if not isinstance(catalog.get("agents"),list):
              raise RuntimeError("Directory catalog unknown: no external POST")
          if any(isinstance(a,dict) and
              (ROOT in str(a.get("card_url","")) or ROOT in str(a.get("call","")))
              for a in catalog["agents"]):
              print("AGENTBAZAAR_ALREADY_INDEXED; NO POST")
              raise SystemExit(0)
          # Last attempt supplied MCP only and returned HTTP 400. This one supplies
          # their explicitly documented A2A agent_card_url instead, exactly once.
          body=json.dumps({"agent_card_url":CARD}).encode()
          req=urllib.request.Request("https://agentbazaar.tech/v1/sell",data=body,method="POST",
              headers={**HEADERS,"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=40) as response:
                  code=response.status
                  # Do not log response bodies or headers; provider may issue an API key.
          except urllib.error.HTTPError as exc:
              code=exc.code
              raw=exc.read(700).decode("utf-8","replace")
              raw=re.sub(r"(?i)(?:api[_-]?key|token|secret|authorization)[^,}\n]{0,100}","[redacted]",raw)
              raw=re.sub(r"(?:0x)?[0-9a-fA-F]{40,}","[redacted]",raw)
              print("AGENTBAZAAR_REJECTION_SUMMARY",raw[:220])
          print("AGENTBAZAAR_A2A_REGISTRATION_HTTP",code)
          if code not in (200,201,202,409):
              raise RuntimeError("Not accepted; no repeated submissions")
          print("AgentBazaar accepted a registration request or detected duplicate. Public indexing requires read-back.")
          print("No access tokens, funds, private keys, fake offers or real customer activity were posted.")
          PY
