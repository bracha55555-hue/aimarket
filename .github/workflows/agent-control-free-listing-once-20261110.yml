name: List AI Market once in the free Agent Control agent directory
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-control-free-listing-once-20261110.yml
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify real endpoints, avoid duplicate listing, submit free listing once
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          site="https://aimarket-997u.onrender.com"
          api="https://agent-control.net/api/v1/agents/listings"
          headers={"User-Agent":"AI-Market-Owner-Approved-Free-Directory-Listing/1.0","Accept":"application/json"}
          def get(url,limit=1500000):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=24) as r:
                  if r.status!=200:raise RuntimeError("Read endpoint not ready")
                  data=r.read(limit+1)
                  if len(data)>limit:raise RuntimeError("Read result too large; no submission")
                  return json.loads(data)
          health=get(site+"/health")
          manifest=get(site+"/.well-known/mcp.json")
          card=get(site+"/.well-known/agent-card.json")
          if (health.get("status")!="online" or manifest.get("url")!=site+"/mcp"
              or not any(isinstance(x,dict) and x.get("url")==site+"/a2a"
                         for x in card.get("supportedInterfaces",[]))):
              raise RuntimeError("Real public MCP/A2A endpoints unavailable; no submission")
          data=get(api)
          rows=data if isinstance(data,list) else next((data[k] for k in ("listings","agents","items","results","data")
                         if isinstance(data,dict) and isinstance(data.get(k),list)),None)
          if not isinstance(rows,list):raise RuntimeError("Directory list schema unknown; no POST")
          if isinstance(data,dict) and isinstance(data.get("total"),int) and data["total"]>len(rows):
              raise RuntimeError("Incomplete directory page; cannot deduplicate safely")
          for x in rows:
              if not isinstance(x,dict):continue
              fields=(str(x.get(k,"")).rstrip("/").lower() for k in ("link","contact"))
              if site.lower() in fields or (x.get("name")=="AI Market" and
                  site in json.dumps(x,ensure_ascii=True)):
                  print("ALREADY_LISTED; no duplicate submitted")
                  raise SystemExit(0)
          payload={"name":"AI Market","skills":["MCP discovery","A2A discovery","agent service directory","buyer task discovery"],
             "pitch":"Open-source discovery of genuine independently operated AI-agent service offers and unfunded buyer tasks. Free, no-key MCP/A2A read-only access; no escrow, guaranteed sellers or funded orders.",
             "contact":site+"/hire-ai-agent","link":site}
          req=urllib.request.Request(api,data=json.dumps(payload,separators=(",",":")).encode(),
              method="POST",headers={**headers,"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  status=r.status
                  reply=r.read(15000).decode("utf-8","replace")
          except urllib.error.HTTPError as e:
              print("FREE_LISTING_REJECTED_HTTP",e.code)
              raise
          if status!=201:raise RuntimeError("Directory did not confirm listing creation")
          try:res=json.loads(reply)
          except ValueError:raise RuntimeError("Non-JSON listing receipt")
          print("FREE_LISTING_CREATED_HTTP",status)
          print("DIRECTORY_PUBLIC_RECEIPT",json.dumps({k:res.get(k) for k in ("id","url","link","status")
              if isinstance(res,dict) and isinstance(res.get(k),(str,int))})[:500])
          print("No payment, API key, fabricated buyer, trade or revenue.")
          PY
