name: Validate expiring orders
on:
  push:
    branches: [hardening/expiring-ephemeral-orders-20261025]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt httpx
      - run: python -m py_compile app.py
      - name: Test expiry and core API
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app import app, active_trades, expire_stale_trades, TRADE_TTL_SECONDS
          now = 5000
          active_trades['expired'] = {'created_monotonic': now-TRADE_TTL_SECONDS-1, 'status':'pending'}
          active_trades['valid'] = {'created_monotonic': now-1, 'status':'pending'}
          assert expire_stale_trades(now)==1
          assert 'expired' not in active_trades and 'valid' in active_trades
          active_trades.clear()
          with TestClient(app) as client:
              assert client.get('/health').json()['ephemeral_trade_ttl_seconds']==TRADE_TTL_SECONDS
              assert client.get('/').status_code==200
              assert client.get('/api/agents?format=n4').status_code==200
          print('TTL guard passed')
          PY