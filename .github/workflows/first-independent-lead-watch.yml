name: Check for real independent AI Market business leads
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/first-independent-lead-watch.yml
  schedule:
    - cron: "13 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  verify-new-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public lead channels; open one GitHub issue only on meaningful new activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.parse,urllib.request,urllib.error
          REPO=os.environ["GITHUB_REPOSITORY"]
          API="https://api.github.com/repos/"+REPO
          H={"Accept":"application/vnd.github+json",
             "User-Agent":"AI-Market-Operator-Read-Only-Lead-Watch/1.0"}
          def get(url,github=False):
              headers={**H}
              if github:
                  headers["Authorization"]="Bearer "+os.environ["GH_TOKEN"]
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=18) as r:
                      return json.loads(r.read(300000).decode("utf-8"))
              except (urllib.error.HTTPError,urllib.error.URLError,ValueError,TimeoutError) as exc:
                  print("READ_FAILED",urllib.parse.urlsplit(url).netloc,type(exc).__name__)
                  return None
          def get_thread(num):
              data=get("https://agentsboard.org/api/v1/threads/"+str(num))
              if not isinstance(data,dict):return None
              result=data.get("replies")
              if result is None:
                  item=data.get("thread",data.get("post",{}))
                  if isinstance(item,dict):result=item.get("replies")
              return result if isinstance(result,list) else None
          leads=[]
          thread=get_thread(240)
          if thread is not None:
              replies=[r for r in thread if isinstance(r,dict) and isinstance(r.get("id"),int)
                       and r["id"]>518 and
                       "shejiao-daren" in str(r.get("author",{})).lower() and
                       len(str(r.get("body","")).strip())>15]
              for reply in sorted(replies,key=lambda x:x["id"],reverse=True)[:5]:
                  leads.append(("AI MARKET: supplier response "+str(reply["id"])+" in thread 240",
                      "A public handle named shejiao-daren posted reply #"+str(reply["id"])+
                      " after our relevant outreach. Identity and interest are unverified. Read the original: "+
                      "https://agentsboard.org/?thread=240. No agreement, order or money is implied."))
              print("CAMPFIRE_PROVIDER_REPLIES",len(replies))
          else:print("CAMPFIRE_PROVIDER_REPLIES_UNKNOWN")
          initial=get_thread(270)
          if initial is not None:
              replies=[r for r in initial if isinstance(r,dict)
                  and isinstance(r.get("id"),int) and r["id"]>520
                  and "ai market operator" not in str(r.get("author",{})).lower()
                  and len(str(r.get("body","")).strip())>35
                  and any(w in str(r.get("body","")).lower() for w in
                      ("mcp","a2a","service","provider","task","agent","listing","help","offer"))]
              for reply in sorted(replies,key=lambda x:x["id"],reverse=True)[:5]:
                  leads.append(("AI MARKET: external reply "+str(reply["id"])+" in thread 270",
                      "A new public-handle reply #"+str(reply["id"])+
                      " appeared after our independent pilot onboarding (#520). "+
                      "Public aliases are not identity-verified; review the exact message for a genuine lead: "+
                      "https://agentsboard.org/?thread=270. No signed listing, agreement or payment inferred."))
              print("CAMPFIRE_LAUNCH_REPLIES",len(replies))
          else:print("CAMPFIRE_LAUNCH_REPLIES_UNKNOWN")
          # Only replies after our one-time invitations; never count our own posts or invent partners.
          for tid,cutoff,kind in ((187,522,"free provider"),(228,523,"actual free buyer")):
              later=get_thread(tid)
              if later is None:
                  print("TARGETED_EXTERNAL_REPLIES_UNAVAILABLE",tid)
                  continue
              new=[r for r in later if isinstance(r,dict)
                  and isinstance(r.get("id"),int) and r["id"]>cutoff
                  and "ai market operator" not in str(r.get("author",{})).lower()
                  and len(str(r.get("body","")).strip())>=30]
              print("TARGETED_EXTERNAL_REPLIES",tid,len(new))
              for entry in sorted(new,key=lambda v:v["id"],reverse=True)[:3]:
                  leads.append(("AI MARKET: "+kind+" forum response #"+str(entry["id"]),
                      "An unverified external public handle posted a new response after our specific "
                      "opt-in invitation. Read original thread: https://agentsboard.org/?thread="+str(tid)+
                      " ; reply #"+str(entry["id"])+
                      ". Not evidence of onboarding, authorization, identity or payment."))
          # An operator independently approached us in GitHub issue #25 and agreed to a free
          # read-only tool-manifest baseline; new outside replies may contain signed evidence.
          comments=get(API+"/issues/25/comments?per_page=100",github=True)
          if isinstance(comments,list):
              new=[c for c in comments if isinstance(c,dict)
                  and isinstance(c.get("id"),int)
                  and c.get("created_at","")>"2026-10-31T22:17:06Z"
                  and c.get("user",{}).get("login")=="vdineshk"]
              for entry in sorted(new,key=lambda v:v["id"],reverse=True)[:3]:
                  leads.append(("AI MARKET: independent MCP audit response #"+str(entry["id"]),
                      "A named external GitHub account posted after our public-only capture permission. "+
                      "Review source and signed receipt, if any: "+
                      "https://github.com/bracha55555-hue/aimarket/issues/25#issuecomment-"+
                      str(entry["id"])+
                      ". Independently check trust, content and limits; no paid audit is authorized."))
              print("EXTERNAL_INDEPENDENT_GITHUB_AUDIT_REPLIES",len(new))
          else:
              print("EXTERNAL_INDEPENDENT_GITHUB_AUDIT_REPLIES_UNKNOWN")
          # Real, independent GitHub agent Vireo filed public provider-interest issue #76.
          # Monitor actual new author replies to our first scoped discussion, never
          # count our own response (#6597925653) as a business lead or a sale.
          vireo_comments=get(API+"/issues/76/comments?per_page=100",github=True)
          if isinstance(vireo_comments,list):
              replies=[c for c in vireo_comments if isinstance(c,dict)
                  and isinstance(c.get("id"),int) and c["id"]>6597925653
                  and isinstance(c.get("user"),dict)
                  and c["user"].get("login")=="vireo-agent"]
              for response in sorted(replies,key=lambda item:item["id"],reverse=True)[:3]:
                  ident=response["id"]
                  leads.append(("AI MARKET: independent Vireo provider reply #"+str(ident),
                      "The independent GitHub provider vireo-agent responded after our one-off "
                      "scope and settlement-compatibility inquiry. Read the specific public reply: "
                      "https://github.com/bracha55555-hue/aimarket/issues/76#issuecomment-"+str(ident)+
                      " . This is a public business lead, NOT acceptance of a purchase, "
                      "authenticated seller listing, agent capability certification, delivery "
                      "or verified crypto settlement. Do not send funds or claim a sale."))
              print("EXTERNAL_VIREO_PROVIDER_REPLIES",len(replies))
          else:
              print("EXTERNAL_VIREO_PROVIDER_REPLIES_UNKNOWN")
          # Existing relevant independent, explicitly opt-in cross-operator replies.
          # Only source-specific author comments AFTER our last operator reply count.
          for topic,cutoff,external,kind in (
                (34,6598342756,"dserretti13","Humesh A2A/MCP collaboration"),
                (14,6598306029,"robertwmccarty-caelum","Linked AIs/BuddyLists interop")):
              recent=get(API+"/issues/"+str(topic)+"/comments?per_page=100",github=True)
              if not isinstance(recent,list):
                  print("INDEPENDENT_PARTNER_REPLIES_UNKNOWN",topic)
                  continue
              new=[x for x in recent if isinstance(x,dict)
                  and isinstance(x.get("id"),int) and x["id"]>cutoff
                  and isinstance(x.get("user"),dict)
                  and x["user"].get("login")==external]
              print("INDEPENDENT_PARTNER_REPLIES",topic,len(new))
              for reply in sorted(new,key=lambda q:q["id"],reverse=True)[:3]:
                  ident=reply["id"]
                  leads.append(("AI MARKET: "+kind+" external reply #"+str(ident),
                      "A prior interested independent operator replied after our concrete "
                      "public-only interoperability proposal. Review the original source: "
                      "https://github.com/bracha55555-hue/aimarket/issues/"+
                      str(topic)+"#issuecomment-"+str(ident)+
                      " . This is an unverified collaboration signal, not a funded "
                      "order, signed provider, completed task, endorsed product or sale. "
                      "No external content or private contact details copied."))
          # Jishie accepted a free submission with HTTP 202. The public index may
          # publish it later; search read-only and only notify on an exact MCP match.
          index=get("https://jishie.com/v1/agents?q=AI%20Market&include_unprobed=true")
          if isinstance(index,dict):
              records=index.get("results")
              if isinstance(records,list) and any(
                  isinstance(item,dict)
                  and isinstance(item.get("protocols"),dict)
                  and item["protocols"].get("mcp")==
                       "https://aimarket-997u.onrender.com/mcp"
                  for item in records):
                  leads.append(("AI MARKET: confirmed independent jishie directory listing",
                      "The free jishie search API returned the exact public "
                      "AI Market MCP endpoint. Check the current source: "
                      "https://jishie.com/v1/agents?q=AI%20Market&include_unprobed=true "
                      " . A directory listing is not an external user, "
                      "merchant, funded transaction or revenue."))
                  print("JISHIE_EXACT_MCP_LISTING_FOUND")
              else: print("JISHIE_INDEXING_NOT_CONFIRMED")
          else: print("JISHIE_DIRECTORY_READ_UNAVAILABLE")
          # Zero-wallet public buyer inquiries are legitimate marketing leads,
          # but never signed buyer records, funded tasks, orders or sales.
          # Read source GitHub issue metadata only. No user-provided body,
          # address, budget or task description is copied into an alert.
          public_issues=get(API+"/issues?state=open&per_page=100",github=True)
          if isinstance(public_issues,list):
              buyers=[x for x in public_issues if isinstance(x,dict)
                  and not x.get("pull_request") and x.get("state")=="open"
                  and isinstance(x.get("number"),int)
                  and type(x.get("number")) is int
                  and isinstance(x.get("title"),str)
                  and x["title"].startswith("[Public buyer interest] ")
                  and isinstance(x.get("user"),dict)
                  and x["user"].get("login")!="bracha55555-hue"
                  and x.get("html_url")==
                     "https://github.com/bracha55555-hue/aimarket/issues/"+
                     str(x["number"])]
              print("PUBLIC_INDEPENDENT_UNVERIFIED_BUYER_ISSUES",len(buyers))
              for row in sorted(buyers,key=lambda v:v["number"],reverse=True)[:10]:
                  number=row["number"]
                  leads.append(("AI MARKET: real public buyer interest #"+str(number),
                      "An independent GitHub author posted a public, unverified "
                      "buyer inquiry using our opt-in no-wallet issue form. "
                      "Review the ORIGINAL source: "
                      "https://github.com/bracha55555-hue/aimarket/issues/"+str(number)+
                      " . It is not signed demand, identity proof, a funded order, "
                      "permission to purchase, agreement, delivery or settlement. "
                      "Contact only through the original issue after examining scope; "
                      "never invent the task or send funds."))
          else:
              print("PUBLIC_BUYER_INTEREST_SOURCE_UNAVAILABLE")
          # One real review receipt from the official free PostLaunchKit submission.
          # A 202/pending review is NOT a live listing. Only a public approved URL
          # from that exact receipt or a real rejection/change request merits a notice.
          pk_id="d4670710-53fe-4205-8e3e-207f4849377b"
          pk=get("https://postlaunchkit.com/api/v1/submissions/"+pk_id)
          if isinstance(pk,dict):
              state=pk.get("status")
              url=pk.get("page_url")
              if state=="approved" and isinstance(url,str) and url.startswith(
                   "https://postlaunchkit.com/directory/") and len(url)<230:
                  print("POSTLAUNCHKIT_OFFICIALLY_APPROVED",url)
                  leads.append(("AI MARKET: PostLaunchKit listing independently approved",
                      "An external directory now reports approved for the original "
                      "free AI Market submission receipt, with official page: "+url+
                      " . This is verified directory visibility, NOT a customer, "
                      "agent adoption, service delivery, order, crypto settlement "
                      "or paid revenue. Verify the page currently shows the real AI Market domain."))
              elif state in ("rejected","changes_requested"):
                  print("POSTLAUNCHKIT_REVIEW_ACTION_REQUIRED",state)
                  leads.append(("AI MARKET: PostLaunchKit requires review "+state,
                      "The original free AI Market submission was reported "+
                      state+" by the public review-status API. Open the official "
                      "directory and review requirements before responding; "
                      "do not send paid fees, invent credentials or re-submit blindly. "
                      "Receipt: "+pk_id+"."))
              else:print("POSTLAUNCHKIT_NOT_PUBLICLY_APPROVED",str(state)[:55])
          else:print("POSTLAUNCHKIT_REVIEW_STATUS_UNAVAILABLE")
          # AgentNDX receipt #320 is only a received review request (HTTP 201).
          # Notify on independently observed public index publication, never on receipt alone.
          try:
              url="https://agentndx.ai/api/servers.json"
              req=urllib.request.Request(url,headers={**H,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  if response.status!=200:raise ValueError("Directory unavailable")
                  raw=response.read(6500001)
              if len(raw)>6500000:raise ValueError("Directory response exceeds safe size")
              index=json.loads(raw.decode("utf-8"))
              entries=index.get("servers") if isinstance(index,dict) else None
              if not isinstance(entries,list):raise ValueError("Directory entries unavailable")
              found=[row for row in entries if isinstance(row,dict) and
                  (str(row.get("github_url","")).rstrip("/").lower()
                      =="https://github.com/bracha55555-hue/aimarket" or
                   str(row.get("homepage_url","")).rstrip("/").lower()
                      =="https://aimarket-997u.onrender.com")]
              print("AGENTNDX_PUBLIC_INDEX_ENTRIES_MATCHING_PROJECT",len(found))
              if found:
                  leads.append(("AI MARKET: AgentNDX independently published AI Market listing",
                      "AgentNDX's own public server index now contains an entry naming the exact "
                      "AI Market repository or production homepage. Review the independently "
                      "published directory metadata at https://agentndx.ai/api/servers.json "
                      "and browse https://agentndx.ai/servers. Submission receipt #320 alone "
                      "did not establish publication. Listing is proof of discoverability ONLY, "
                      "NOT verified independent users, qualified buyers, signed offers, "
                      "fulfillment, cryptocurrency settlements or commission revenue."))
          except (urllib.error.HTTPError,urllib.error.URLError,ValueError,TimeoutError) as exc:
              print("AGENTNDX_PUBLIC_REVIEW_CHECK_UNAVAILABLE",type(exc).__name__)
          m=get("https://aimarket-997u.onrender.com/api/market/stats")
          if isinstance(m,dict):
              offers=int(m.get("signed_offline_offers") or 0)
              buyers=int(m.get("open_verified_buyer_requests") or 0)
              online=int(m.get("authenticated_online_agents") or 0)
              if online>0:
                  leads.append(("AI MARKET: first online identity-authenticated agents",
                      "Production has at least one online agent session. Verify source and identity "+
                      "before assuming independence or availability: "+
                      "https://aimarket-997u.onrender.com/api/market/stats . No orders/payments implied."))
              if offers>0:
                  catalog=get("https://aimarket-997u.onrender.com/api/signed-offers")
                  rows=catalog.get("signed_offline_offers") if isinstance(catalog,dict) else None
                  if isinstance(rows,list):
                      for offer in rows[:10]:
                          if not isinstance(offer,dict) or not isinstance(offer.get("offer_id"),str):continue
                          digest=hashlib.sha256(offer["offer_id"].encode()).hexdigest()[:12]
                          leads.append(("AI MARKET: signed offer detected "+digest,
                              "Production contains a newly observed identity-signed offline service advertisement. "+
                              "Inspect the current public catalog: https://aimarket-997u.onrender.com/api/signed-offers "+
                              "Signature verifies key control only, not operator independence, ability, response, "+
                              "payment or service delivery. No secret key or user-entered content included here."))
                  else: print("OFFERS_CATALOG_UNVERIFIED_NO_ISSUE")
              if buyers>0:
                  demand=get("https://aimarket-997u.onrender.com/api/requests")
                  rows=demand.get("verified_buyer_requests") if isinstance(demand,dict) else None
                  if isinstance(rows,list):
                      for item in rows[:10]:
                          if not isinstance(item,dict) or not isinstance(item.get("id"),str):continue
                          digest=hashlib.sha256(item["id"].encode()).hexdigest()[:12]
                          leads.append(("AI MARKET: signed buyer request detected "+digest,
                              "Production contains an identity-signed unfunded real task request. "+
                              "Review its current public terms: https://aimarket-997u.onrender.com/api/requests "+
                              "Neither funds, operator independence nor a binding order are verified. "+
                              "No customer-entered task text included in this notification."))
                  else: print("DEMAND_CATALOG_UNVERIFIED_NO_ISSUE")
              print("LIVE_NONZERO_ACTIVITY",int(offers>0 or buyers>0 or online>0))
          else:print("LIVE_MARKET_READ_FAILED")
          if not leads:
              print("NO_NEW_VERIFIED_BUSINESS_LEAD; no issue opened, no external writing")
              raise SystemExit(0)
          existing=get(API+"/issues?state=all&per_page=100",github=True)
          if not isinstance(existing,list):raise RuntimeError("Cannot deduplicate notification issue; no writes")
          present={r.get("title") for r in existing if isinstance(r,dict) and not r.get("pull_request")}
          for title,description in leads[:10]:
              if title in present:
                  print("LEAD_ALREADY_RECORDED",title)
                  continue
              payload=json.dumps({"title":title,"body":description}).encode("utf-8")
              req=urllib.request.Request(API+"/issues",method="POST",data=payload,
                  headers={**H,"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                           "Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=22) as r:
                      event=json.loads(r.read(10000).decode())
                      if r.status!=201:raise RuntimeError("Issue write not confirmed")
                      print("NEW_GENUINE_LEAD_REVIEW_ISSUE",event.get("html_url"))
              except urllib.error.HTTPError as exc:
                  print("LEAD_NOTIFICATION_FAILED_HTTP",exc.code)
                  raise
          print("No forum posts, customer emails, wallet operations, purchases or synthetic traffic performed.")
          PY
