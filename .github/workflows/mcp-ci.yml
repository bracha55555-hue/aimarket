name: Verify MCP discovery
on:
  push:
    branches: [integration/mcp-discovery-20261025]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt httpx
      - run: python -m py_compile app.py
      - name: Test public API and MCP
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app import app
          m = {'io.modelcontextprotocol/protocolVersion':'2026-07-28','io.modelcontextprotocol/clientCapabilities':{}}
          h = {'accept':'application/json, text/event-stream','content-type':'application/json','mcp-protocol-version':'2026-07-28'}
          with TestClient(app) as c:
              assert c.get('/health').json()['status']=='online'
              assert c.get('/.well-known/ai-market.json').json()['mcp_version']=='2026-07-28'
              h['mcp-method']='server/discover'
              r=c.post('/mcp',headers=h,json={'jsonrpc':'2.0','id':1,'method':'server/discover','params':{'_meta':m}})
              assert r.status_code==200, r.text
              assert r.json()['result']['supportedVersions']==['2026-07-28']
              h['mcp-method']='tools/list'
              r=c.post('/mcp',headers=h,json={'jsonrpc':'2.0','id':2,'method':'tools/list','params':{'_meta':m}})
              assert r.status_code==200, r.text
              assert len(r.json()['result']['tools'])==3
              h['mcp-method']='tools/call'
              h['mcp-name']='marketplace_status'
              r=c.post('/mcp',headers=h,json={'jsonrpc':'2.0','id':3,'method':'tools/call','params':{'name':'marketplace_status','arguments':{},'_meta':m}})
              assert r.status_code==200, r.text
              assert r.json()['result']['structuredContent']['verified_settlement'] is False
              from app import encode_n4_directory
              catalog = {
                  '0x'+'1'*40: {'capabilities': ['translate', 'summarize', 'special_compact'], 'pricing': {'translate': 0.015, 'summarize': 0.4, 'special_compact': 5.0}},
                  '0x'+'2'*40: {'capabilities': ['translate', 'extract'], 'pricing': {'translate': 0.01, 'extract': 1.0}}
              }
              packed = encode_n4_directory(catalog)
              assert packed['codec'] == 'N4-v1' and packed['count'] == 2
              from collections import Counter
              import base64
              for row in packed['agents']:
                  address, payload, count, escaped, prices = row
                  bs = base64.b64decode(payload + '='*((4-len(payload)%4)%4))
                  indices = [bs[i//2] & 15 if i%2 else bs[i//2] >> 4 for i in range(count)]
                  unknown = iter(escaped)
                  decoded = [next(unknown) if n == 15 else packed['dictionary'][n] for n in indices]
                  assert decoded == catalog[address]['capabilities']
                  assert prices == [catalog[address]['pricing'][c] for c in decoded]
              assert c.get('/api/agents?format=n4').status_code == 200
              assert c.get('/client/n4.js').status_code == 200
              assert 'decodeN4' in c.get('/client/n4.js').text
          print('PASS')
          PY