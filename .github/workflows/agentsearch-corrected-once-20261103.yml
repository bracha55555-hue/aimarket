name: One-time AgentSearch corrected real site URL submission
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agentsearch-corrected-once-20261103.yml
permissions:
  contents: read
jobs:
  corrected-agentsearch-url:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact deployed main, read-only probe, and submit documented real site URL once
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: python3 scripts/agentsearch-corrected-once.py
