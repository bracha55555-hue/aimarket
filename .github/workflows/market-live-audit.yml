name: Verify AI Market live adoption and official registry
on:
  pull_request:
    branches: [main]
    paths:
      - app.py
      - server.json
      - .github/workflows/market-live-audit.yml
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'  # UTC; four read-only checks per day
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only production, onboarding and registry verification
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          import urllib.error
          import urllib.parse

          base="https://aimarket-997u.onrender.com"
          registry="https://registry.modelcontextprotocol.io/v0.1/servers/"
          expected=json.load(open("server.json",encoding="utf-8"))["version"]
          name="io.github.bracha55555-hue/aimarket"
          result={"expected_registry_version":expected,
                  "scope":"Read-only external snapshot; process counters reset at server restart",
                  "private_keys_used":False,"payments_sent":False}

          def fetch(url, data=None, headers=None):
              h={"User-Agent":"AI-Market-Official-Business-Audit/1.0",
                 "Accept":"application/json",**(headers or {})}
              req=urllib.request.Request(url,data=data,headers=h,method="POST" if data else "GET")
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      return json.load(response),None
              except urllib.error.HTTPError as exc:
                  return None,f"HTTP_{exc.code}"
              except (OSError,ValueError,TimeoutError) as exc:
                  return None,type(exc).__name__

          health,error=fetch(base+"/health")
          live_sha=(health or {}).get("deployed_git_sha")
          expected_sha=os.getenv("GITHUB_SHA") if os.getenv("GITHUB_REF")=="refs/heads/main" else None
          verified=bool(live_sha and re.fullmatch("[0-9a-f]{40}",live_sha))
          result["production_health"]={"status":health.get("status"),"escrow":health.get("escrow"),
                                        "deployed_git_sha":live_sha} if health else {"error":error}
          result["deployment_verification"]={
              "expected_main_git_sha":expected_sha,
              "deployed_git_sha":live_sha if verified else None,
              "status":("unknown" if not expected_sha or not verified else
                        "current" if expected_sha==live_sha else "lagging"),
              "not_a_deploy_confirmation":bool(not verified or not expected_sha),
              "explanation":"Only exact full SHA proves current revision. PR audits do not compare their head with production; push audits may race Render deploys."}
          # Inspect landing-page conversion rollout without claiming deployment just because GitHub merged.
          try:
              req=urllib.request.Request(base+"/",headers={
                  "User-Agent":"AI-Market-Official-Business-Audit/1.0","Accept":"text/html"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  body=response.read(160000).decode("utf-8","replace")
              result["production_homepage"]={
                  "real_work_funnel_live":"Real work." in body and "Offer real services." in body,
                  "contains_real_market_snapshot":"Live marketplace snapshot" in body}
          except (OSError,ValueError,TimeoutError) as exc:
              result["production_homepage"]={"error":type(exc).__name__}
          # Read-only confirmation of actual deployed two-sided browser funnel; never create orders.
          result["production_browser_funnel"]={}
          for page,needle in (("/post-job","buyer-matches"),
                              ("/list-service","id=\"provider\""),
                              ("/seller-inbox","Review real buyer proposals")):
              try:
                  req=urllib.request.Request(base+page,headers={
                      "User-Agent":"AI-Market-Official-Business-Audit/1.0","Accept":"text/html"})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      body=response.read(160000).decode("utf-8","replace")
                  result["production_browser_funnel"][page]={"status":"online",
                      "feature_visible":needle in body}
              except (OSError,ValueError,TimeoutError) as exc:
                  result["production_browser_funnel"][page]={"error":type(exc).__name__}
          # Verify actual production client availability; this official audit must not count as adoption.
          try:
              req=urllib.request.Request(base+"/client/publish-offer.py",headers={
                  "User-Agent":"AI-Market-Official-Business-Audit/1.0","Accept":"text/x-python"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  script=response.read(40000).decode("utf-8","replace")
                  ctype=response.headers.get("Content-Type","").lower()
              result["production_headless_provider_client"]={
                  "status":"available" if response.status==200 and "text/x-python" in ctype else "unexpected",
                  "identity_only_explicit_approval":
                      all(text in script for text in
                          ("--publish","validate_challenge","eth_account","NoCrossOriginRedirect")),
                  "no_download_or_key_actions_performed":True}
          except urllib.error.HTTPError as exc:
              result["production_headless_provider_client"]={"error":"HTTP_"+str(exc.code)}
          except (OSError,ValueError,TimeoutError) as exc:
              result["production_headless_provider_client"]={"error":type(exc).__name__}
          stats,error=fetch(base+"/api/market/stats")
          if stats:
              e=stats.get("events_since_start") or {}
              result["production_market"]={
                  "since":stats.get("since"),"online_agents":stats.get("authenticated_online_agents"),
                  "offline_signed_offers":stats.get("signed_offline_offers"),
                  "buyer_requests":stats.get("open_verified_buyer_requests"),
                  "nonbinding_proposals":stats.get("nonbinding_intents_proposed"),
                  "nonbinding_acknowledgements":stats.get("nonbinding_intents_accepted"),
                  "chain_settlements_verified":e.get("settlements_verified"),
                  "new_buyer_requests_since_restart":e.get("requests_published")}
              result["production_business_funnel"]=stats.get("business_funnel_events",{"note":"Not available until new release is actually deployed"})
          else:
              result["production_market"]={"error":error}
          metadata,error=fetch(base+"/.well-known/mcp.json")
          result["production_mcp"]={"version":metadata.get("version"),
                                    "url":metadata.get("url")} if metadata else {"error":error}
          # List available MCP tools WITHOUT running any of them or signing a transaction.
          params={"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28",
                           "io.modelcontextprotocol/clientCapabilities":{}}}
          body=json.dumps({"jsonrpc":"2.0","id":1,"method":"tools/list","params":params}).encode()
          response,error=fetch(base+"/mcp",body,{
              "Content-Type":"application/json","Accept":"application/json, text/event-stream",
              "MCP-Protocol-Version":"2026-07-28","Mcp-Method":"tools/list"})
          if response and "result" in response:
              listed=response["result"].get("tools",[])
              seller=next((t for t in listed if t.get("name")=="prepare_signed_offer"),{})
              required=seller.get("inputSchema",{}).get("required",[])
              result["production_seller_onboarding"]={
                  "tool_present":bool(seller),
                  "website_not_required":bool(seller and "contact_url" not in required),
                  "required_fields":required,
                  "intents_supported":all(t in {tool.get("name") for tool in listed} for t in
                      ("prepare_purchase_intent","publish_purchase_intent","accept_purchase_intent"))}
          else:
              result["production_seller_onboarding"]={"error":error or (response or {}).get("error")}
          url=(registry+urllib.parse.quote(name,safe="")+"/versions/latest")
          record,error=fetch(url)
          if record:
              server=record.get("server",record)
              result["official_registry"]={"available":True,"name":server.get("name"),
                  "latest_version":server.get("version"),
                  "version_matches_manifest":server.get("version")==expected}
          else:
              result["official_registry"]={"available":False,"error":error}
          # Public directory visibility is independent of an HTTP 201 private registration receipt.
          # Never send or read an edit token or recovery phrase in this audit.
          directory={"status":"not_independently_verified","public_endpoint_matches":False}
          for suffix in ("/agent/ai-market","/search?q=AI%20Market"):
              try:
                  url="https://allagents.app"+suffix
                  req=urllib.request.Request(url,headers={
                      "User-Agent":"AI-Market-Public-Directory-Verification/1.0",
                      "Accept":"text/html, application/json"})
                  with urllib.request.urlopen(req,timeout=18) as response:
                      body=response.read(250000).decode("utf-8","replace")
                  found="aimarket-997u.onrender.com" in body
                  directory["checked"] = directory.get("checked", []) + [
                      {"url":url,"http_status":response.status,"contains_exact_market_domain":found}]
                  if found:
                      directory["status"]="public_listing_referenced"
                      directory["public_endpoint_matches"]=True
                      if suffix=="/agent/ai-market": directory["candidate_card_url"]=url
              except urllib.error.HTTPError as exc:
                  directory["checked"] = directory.get("checked", []) + [
                      {"url":url,"http_status":exc.code,"contains_exact_market_domain":False}]
              except (OSError,ValueError,TimeoutError) as exc:
                  directory["checked"] = directory.get("checked", []) + [
                      {"url":url,"error":type(exc).__name__}]
          result["allagents_directory"]=directory
          # A third-party directory submission was acknowledged as pending on 2026-10-30.
          # Check actual public discoverability, never count queue acceptance as a listing.
          listing={"status":"not_publicly_verified","listed":False}
          try:
              uri="https://mcp.tc/v0.1/servers?search=AI%20Market&limit=100"
              req=urllib.request.Request(uri,headers={
                  "User-Agent":"AI-Market-Official-Business-Audit/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=json.load(response)
              if isinstance(data,dict):
                  matches=[]
                  for row in data.get("servers",[]):
                      server=row.get("server",row) if isinstance(row,dict) else {}
                      if not isinstance(server,dict): continue
                      if any(isinstance(remote,dict) and remote.get("url")==base+"/mcp"
                             for remote in server.get("remotes",[])):
                          matches.append(server.get("name","unknown"))
                  if matches:
                      listing={"status":"public_listing_verified","listed":True,
                               "exact_endpoint_match":True,"server_names":matches[:3]}
                  else:
                      listing={"status":"not_yet_visible","listed":False}
          except urllib.error.HTTPError as exc:
              listing={"status":"http_error","error":"HTTP_"+str(exc.code),"listed":False}
          except (OSError,ValueError,TimeoutError) as exc:
              listing={"status":"unverified","error":type(exc).__name__,"listed":False}
          result["mcptc_directory"]=listing
          # Check actual public no-key onboarding deployment. No POSTs, generated visitors or auto-enrollment.
          connection={"status":"unverified","available":False}
          try:
              req=urllib.request.Request(base+"/connect",headers={
                  "User-Agent":"AI-Market-Official-Business-Audit/1.0","Accept":"text/html"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  html=response.read(180000).decode("utf-8","replace")
                  code=response.status
              required=("codex mcp add ai-market --url "+base+"/mcp",
                        "claude mcp add --transport http ai-market "+base+"/mcp",
                        "No unsolicited messages","/client/connect-guide.js")
              complete=(code==200 and all(k in html for k in required))
              connection={"status":"deployed" if complete else "incomplete",
                          "available":complete,
                          "read_only_check":True,
                          "one_command_codex_and_claude":complete,
                          "no_auto_outreach":True}
          except urllib.error.HTTPError as exc:
              connection={"status":"http_error","available":False,"error":"HTTP_"+str(exc.code)}
          except (OSError,ValueError,TimeoutError) as exc:
              connection={"status":"unknown","available":False,"error":type(exc).__name__}
          result["production_agent_connect_guide"]=connection
          # The genuine provider outreach issue is public and read-only. Counts are NOT unique agents.
          github_outreach={"status":"unverified","comment_events":None}
          try:
              url="https://api.github.com/repos/bracha55555-hue/aimarket/issues/34/comments?per_page=100"
              req=urllib.request.Request(url,headers={
                  "User-Agent":"AI-Market-Official-Business-Audit/1.0","Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=json.load(response)
              if isinstance(data,list):
                  github_outreach={"status":"checked","comment_events":len(data),
                                   "is_unique_real_provider_count":False}
          except urllib.error.HTTPError as exc:
              github_outreach={"status":"http_error","error":"HTTP_"+str(exc.code),"comment_events":None}
          except (OSError,ValueError,TimeoutError) as exc:
              github_outreach={"status":"unknown","error":type(exc).__name__,"comment_events":None}
          result["real_agent_feedback_issue"]=github_outreach
          # We posted one transparent request for relevant voluntary operator introductions.
          # Check the public human-help queue; NEVER publish or repeat it from this audit.
          # No request body, contact details, usernames, credentials or replies are logged.
          liaison={"status":"unverified","request_visible":False,"public_reply_count":None}
          try:
              url="https://commons.dooza.ai/api/human-requests?agent=aimarket-operator&limit=50"
              req=urllib.request.Request(url,headers={
                  "User-Agent":"AI-Market-Official-Business-Audit/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=json.load(response)
              rows=data.get("requests",[]) if isinstance(data,dict) else []
              matching=[row for row in rows if isinstance(row,dict)
                        and row.get("agent")=="aimarket-operator"
                        and isinstance(row.get("title"),str)
                        and "independent AI-agent operators" in row["title"]]
              if matching and isinstance(matching[0].get("id"),str):
                  entry_id=matching[0]["id"]
                  replies_url=("https://commons.dooza.ai/api/entries?reply_to="
                               +urllib.parse.quote(entry_id,safe="")+"&limit=100")
                  req=urllib.request.Request(replies_url,headers={
                      "User-Agent":"AI-Market-Official-Business-Audit/1.0","Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      reply_data=json.load(response)
                  replies=reply_data.get("entries",[]) if isinstance(reply_data,dict) else []
                  liaison={"status":"public_request_visible","request_visible":True,
                           "public_reply_count":len(replies) if isinstance(replies,list) else None,
                           "replies_are_not_verified_operators":True}
              else:
                  liaison={"status":"not_found","request_visible":False,"public_reply_count":0}
          except urllib.error.HTTPError as exc:
              liaison={"status":"http_error","request_visible":False,"error":"HTTP_"+str(exc.code),
                       "public_reply_count":None}
          except (OSError,ValueError,TimeoutError) as exc:
              liaison={"status":"unknown","request_visible":False,"error":type(exc).__name__,
                       "public_reply_count":None}
          result["real_agent_human_introduction"]=liaison
          print("AI_MARKET_VERIFIABLE_BUSINESS_AUDIT",json.dumps(result,sort_keys=True))
          print("Important: these are read-only observations, not unique user counts or proven lifetime revenue.")
          PY
