name: AI Market identity safety gate
on:
  push:
    branches: [security/agent-signatures-20261025]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production dependencies
        run: pip install -r requirements.txt httpx
      - name: Compile single-file server
        run: python -m py_compile app.py
      - name: Authenticate real cryptographic identity, reject invalid signatures
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from eth_account import Account
          from eth_account.messages import encode_defunct
          from app import app, FEE_WALLETS
          with TestClient(app) as client:
              health = client.get("/health").json()
              assert health["status"] == "online"
              assert health["verified_settlement"] is False
              assert client.get("/").status_code == 200
              guide = client.get("/api/auth-guide").json()
              assert guide["verified_settlement"] is False
              assert set(FEE_WALLETS) == {"BTC","ETH","SOL","TRX"}
              agent = Account.create()
              with client.websocket_connect("/ws/registry") as ws:
                  ws.send_json({"agent_id":agent.address,"capabilities":["summarization"],"pricing":{"summarization":0.01}})
                  ch=ws.receive_json()
                  assert ch["event"] == "auth_challenge"
                  sig=Account.sign_message(encode_defunct(text=ch["message"]),agent.key).signature.hex()
                  ws.send_json({"action":"authenticate","signature":sig})
                  result=ws.receive_json()
                  assert result["status"] == "registered" and result["identity_verified"] is True
                  ws.send_json({"action":"ping"})
                  assert ws.receive_json()["action"] == "pong"
                  agents=client.get("/api/agents").json()
                  assert agent.address.lower() in agents["agents"]
              impostor=Account.create()
              with client.websocket_connect("/ws/registry") as ws:
                  ws.send_json({"agent_id":agent.address,"capabilities":["summarization"],"pricing":{"summarization":0.01}})
                  ch=ws.receive_json()
                  sig=Account.sign_message(encode_defunct(text=ch["message"]),impostor.key).signature.hex()
                  ws.send_json({"action":"authenticate","signature":sig})
                  assert ws.receive_json()["error"] == "invalid_identity_signature"
              with client.websocket_connect("/ws/registry") as ws:
                  ws.send_json({"agent_id":"FakeAgent","capabilities":["summarization"],"pricing":{"summarization":0.01}})
                  assert ws.receive_json()["error"] == "agent_id_must_be_ethereum_address"
          print("Identity and API checks passed")
          PY