name: Agent onboarding and adoption safety
on:
  push:
    branches: [main, growth/agent-frictionless-demand-20261026]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt httpx
      - run: python -m py_compile app.py
      - name: Verify production deployment SHA is a bounded public Git commit and no secrets leak
        run: python -m unittest -v test_deploy_revision.py
      - name: Verify Glama official GitHub publisher identity metadata
        run: |
          python - <<'PY'
          import json
          with open("glama.json",encoding="utf-8") as f: data=json.load(f)
          assert data=={"$schema":"https://glama.ai/mcp/schemas/server.json","maintainers":["bracha55555-hue"]}
          print("PASS: Glama schema and real repository maintainer; listing/claim not asserted")
          PY
      - name: Verify host-owned one-time organic IndexNow notification without false adoption
        run: python -m unittest -v test_indexnow_new_pages.py
      - name: Verify genuine read-only A2A 1.0 AgentCard and JSONRPC service
        run: python -m unittest -v test_a2a_discovery.py
      - name: Verify public role-specific organic buyer and provider landing pages
        run: python -m unittest -v test_organic_landing.py
      - name: Verify business homepage shows real market state and safely escapes untrusted offers
        run: python -m unittest -v test_market_homepage.py
      - name: Verify N4 database save, reload and corruption detection
        run: python -m unittest -v test_n4store.py
      - name: Verify real free, scoped and evidence-linked identity-signed provider pilot
        run: python -m unittest -v test_free_evidence_offer.py
      - name: Verify multiple independently signed provider listings
        run: python -m unittest -v test_signed_multi_offers.py
      - name: Verify discoverable signed supplier offers and honest buyer filters
        run: python -m unittest -v test_genuine_discovery.py
      - name: Verify two independently signed genuine purchase intents, replay resistance and N4 restore
        run: python -m unittest -v test_purchase_intents.py
      - name: Verify a provider without a website can receive genuinely signed buyer proposals
        run: python -m unittest -v test_hosted_provider_inbox.py
      - name: Verify real zero-install browser seller listing, signature safety, and MCP compatibility
        run: |
          node --check client/provider-studio.js
          python -m unittest -v test_browser_seller_onboarding.py
      - name: Verify browser buyer proposals against genuine seller demand and exact wallet identity
        run: |
          node --check client/buyer-studio.js
          python -m unittest -v test_browser_buyer_proposal.py
      - name: Verify complete buyer-and-seller browser signing funnel, no payments or identity spoofing
        run: |
          node --check client/seller-inbox.js
          python -m unittest -v test_seller_browser_ack.py
      - name: Verify 24h signed buyer needs, 72h honest supplier offers and 12h nonbinding intentions
        run: |
          node --check client/provider-studio.js
          node --check client/buyer-studio.js
          python -m unittest -v test_market_windows.py
      - name: Verify real buyer and seller business funnel event counts with no identity or payment leakage
        run: python -m unittest -v test_business_funnel.py
      - name: Verify public business metrics ignore official read-only audit page checks
        run: python -m unittest -v test_growth_analytics_audit.py
      - name: Verify browser seller reviews and separately signs genuine buyer proposals, no payment
        run: |
          node --check client/seller-inbox.js
          python -m unittest -v test_seller_browser_ack.py
      - name: Verify zero-browser, opt-in, private-identity signed offline provider client against server
        run: python -m unittest -v test_headless_provider_client.py
      - name: Verify headless real buyer signature challenge, published request and private key isolation
        run: python -m unittest -v test_headless_buyer_client.py
      - name: Verify free no-key one-command agent setup and voluntary nontracking sharing
        run: |
          node --check client/connect-guide.js
          python -m unittest -v test_public_agent_connect.py
      - name: Verify external public directory and headless client without fake downloads
        run: python -m unittest -v test_production_discovery_audit.py
      - name: Verify public agent setup, independent provider feedback and human introductions without repeat outreach
        run: python -m unittest -v test_real_acquisition_audit.py
      - name: Verify real strictly free buyer requests match zero-priced signed providers, never paid offers
        run: python -m unittest -v test_free_buyer_matching.py
      - name: Verify genuine signed MCP buyer request creation, replay resistance and no funds
        run: python -m unittest -v test_signed_mcp_buyer.py
      - name: Verify truthful MCP tool safety annotations, zero-key read path and security policy
        run: python -m unittest -v test_mcp_agent_trust.py
      - name: Verify discoverable RSS contains only current signed requests and offline identity offers
        run: python -m unittest -v test_honest_agent_rss.py
      - name: Verify signed MCP seller offer without WebSocket or server-side keys
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from eth_account import Account
          from eth_account.messages import encode_defunct
          import app as m
          with TestClient(m.app) as c:
              seller=Account.create()
              old={"accept":"application/json, text/event-stream","content-type":"application/json",
                   "mcp-protocol-version":"2025-11-25"}
              def legacy(name,args):
                  return c.post("/mcp",headers=old,json={"jsonrpc":"2.0","method":"tools/call","id":9,
                      "params":{"name":name,"arguments":args}})
              input_data={"agent_id":seller.address,"capability":"translation","currency":"SOL","price":0.015,
                          "contact_url":"https://provider.example/contact"}
              assert c.get("/api/signed-offers").json()["count"]==0
              assert legacy("prepare_signed_offer",{**input_data,"contact_url":"http://localhost:8080"}).status_code==400
              assert legacy("prepare_signed_offer",{**input_data,"contact_url":"https://127.0.0.1/"}).status_code==400
              assert legacy("prepare_signed_offer",{**input_data,"price":-1}).status_code==400
              prep=legacy("prepare_signed_offer",input_data)
              assert prep.status_code==200,prep.text
              challenge=prep.json()["result"]["structuredContent"]
              message=challenge["sign_this_message_exactly"]
              assert seller.address.lower() in message
              sig=Account.sign_message(encode_defunct(text=message),seller.key).signature.hex()
              args={"message":message,"challenge_proof":challenge["challenge_proof"],"signature":sig}
              # Valid signature from the wrong identity must fail.
              wrong=Account.sign_message(encode_defunct(text=message),Account.create().key).signature.hex()
              assert legacy("publish_signed_offer",{**args,"signature":wrong}).status_code==400
              assert legacy("publish_signed_offer",{**args,"message":message.replace("0.015","0.016")}).status_code==400
              assert c.get("/api/signed-offers").json()["count"]==0
              # New and old MCP wire protocol both work; one creates, other reads.
              meta={"io.modelcontextprotocol/protocolVersion":"2026-07-28",
                    "io.modelcontextprotocol/clientCapabilities":{}}
              headers={**old,"mcp-protocol-version":"2026-07-28","mcp-method":"tools/call",
                       "mcp-name":"publish_signed_offer"}
              posted=c.post("/mcp",headers=headers,json={"jsonrpc":"2.0","method":"tools/call","id":10,
                  "params":{"_meta":meta,"name":"publish_signed_offer","arguments":args}})
              assert posted.status_code==200,posted.text
              result=posted.json()["result"]["structuredContent"]
              assert result["published"] is True
              assert result["online"] is False and result["can_accept_marketplace_orders"] is False
              assert result["contact_url_verified"] is False
              listing=c.get("/api/signed-offers").json()
              assert listing["count"]==1 and listing["signed_offline_offers"][0]["agent_id"]==seller.address.lower()
              assert c.get("/api/agents").json()["count"]==0  # never impersonate live providers
              assert legacy("publish_signed_offer",args).status_code==400  # replay
              assert legacy("browse_signed_offers",{"capability":"unrelated"}).json()["result"]["structuredContent"]["count"]==0
              # Simulate expiry without waiting 12h
              m.signed_offers[result["listing"]["offer_id"]]["expires_at_unix"]=0
              m.expire_stale_trades()
              assert c.get("/api/signed-offers").json()["count"]==0
              assert c.get("/api/market/stats").json()["events_since_start"]["signed_offers_published"]==1
              assert c.get("/api/market/stats").json()["events_since_start"]["settlements_verified"]==0
              assert all(k in m.FEE_WALLETS for k in ("BTC","ETH","SOL","TRX"))
          print("PASS: two MCP wire eras, bound EIP-191 signing, replay resistance, expiry, no false online claim")
          PY
      - name: Audit counts-only conversion logging and read current production baseline
        run: |
          python - <<'PY'
          import io, logging, json, urllib.request
          import app
          assert app.logger.getEffectiveLevel()==logging.INFO
          assert app.logger.handlers and app.logger.propagate is False
          capture=io.StringIO()
          handler=app.logger.handlers[0]
          previous=handler.stream
          try:
              handler.stream=capture
              app.usage_event("flight_checks")
          finally:
              handler.stream=previous
          assert "AIMARKET_USAGE type=flight_checks count=" in capture.getvalue()
          print("PASS conversion events are emitted without identities or keys")
          root="https://aimarket-997u.onrender.com"
          for route in ("/api/market/stats","/api/requests","/health"):
              try:
                  req=urllib.request.Request(root+route,headers={"User-Agent":"AI-Market-Own-Audit/1.0"})
                  with urllib.request.urlopen(req,timeout=18) as response:
                      data=json.load(response)
                  if route=="/api/market/stats":
                      print("AUDIT_PRODUCTION_STATISTICS",json.dumps({
                          "scope":data.get("scope"),
                          "started":data.get("since"),
                          "connected_agents":data.get("authenticated_online_agents"),
                          "available_offers":data.get("available_service_offers"),
                          "open_requests":data.get("open_verified_buyer_requests"),
                          "pending_orders":data.get("unsettled_orders_in_memory"),
                          "events":data.get("events_since_start")},sort_keys=True))
                  elif route=="/api/requests":
                      print("AUDIT_PRODUCTION_BUYER_REQUEST_COUNT",data.get("count"),"funds_reserved",data.get("funds_reserved"))
                  else:
                      print("AUDIT_PRODUCTION_HEALTH",json.dumps({
                          "status":data.get("status"),"agents":data.get("connected_agents"),
                          "active_trades":data.get("active_trades"),"durable_trades":data.get("durable_trades")},
                          sort_keys=True))
              except Exception as exc:
                  print("AUDIT_PRODUCTION_SNAPSHOT_UNAVAILABLE",route,type(exc).__name__)
          PY
      - name: Validate independent MCP well-known proof is factual and read-only
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import app
          with TestClient(app.app) as c:
              before=c.get("/api/market/stats").json()["events_since_start"]
              x=c.get("/.well-known/mcp.json")
              assert x.status_code==200 and x.headers["content-type"].startswith("application/json")
              data=x.json()
              assert data["name"]=="io.github.bracha55555-hue/aimarket"
              assert data["url"].endswith("/mcp") and data["transport"]=="streamable-http"
              assert data["free_discovery"] is True and data["escrow"] is False
              assert data["a2a_protocol_supported"] is True
              assert data["a2a_jsonrpc"].endswith("/a2a")
              assert c.get("/api/market/stats").json()["events_since_start"]==before
              assert c.get("/api/requests").json()["count"]==0
          print("PASS: independent directory verification without fake agents or payments")
          PY
      - name: Verify browser buyer funnel, safe output, identity signature and cancellation
        run: |
          node --check client/buyer-studio.js
          python - <<'PY'
          from fastapi.testclient import TestClient
          from eth_account import Account
          from eth_account.messages import encode_defunct
          import app
          with TestClient(app.app) as c:
              initial=c.get("/api/requests").json()
              assert initial["count"]==0
              ui=c.get("/post-job")
              assert ui.status_code==200 and "Sign identity and post" in ui.text
              assert "script-src 'self'" in ui.headers["content-security-policy"]
              assert "unsafe-inline" not in ui.headers["content-security-policy"].split("script-src")[1].split(";")[0]
              script=c.get("/client/buyer-studio.js")
              assert script.status_code==200
              assert "personal_sign" in script.text
              assert "eth_sendTransaction" not in script.text
              assert "privateKey" not in script.text
              assert c.get("/sitemap.xml").text.count("<loc>"+app.PUBLIC_SERVER_URL.rstrip("/")+"/post-job</loc>")==1
              assert "/post-job" in c.get("/",headers={"accept":"text/html"}).text
              who=Account.create()
              with c.websocket_connect("/ws/registry") as ws:
                  ws.send_json({"agent_id":who.address.lower(),"capabilities":[],"pricing":{}})
                  challenge=ws.receive_json()
                  assert challenge["event"]=="auth_challenge"
                  signature=Account.sign_message(encode_defunct(text=challenge["message"]),who.key).signature.hex()
                  ws.send_json({"action":"authenticate","signature":signature})
                  welcome=ws.receive_json()
                  assert welcome["status"]=="registered" and welcome["identity_verified"]
                  ws.send_json({"action":"publish_need","capability":"translation","currency":"ETH",
                                "max_budget":0.01,"details":"<script>alert('x')</script> translate a real file"})
                  made=ws.receive_json()
                  assert made["event"]=="request_published",made
                  item=made["request"]
                  assert item["details"].startswith("<script>")
                  assert made["funds_reserved"] is False
                  board=c.get("/jobs")
                  assert board.status_code==200
                  assert "<script>alert" not in board.text
                  assert "&lt;script&gt;" in board.text
                  record=c.get("/api/requests").json()
                  assert record["count"]==1 and record["verified_buyer_requests"][0]["id"]==item["id"]
                  ws.send_json({"action":"cancel_need","request_id":item["id"]})
                  cancelled=ws.receive_json()
                  assert cancelled["event"]=="request_cancelled" and cancelled["removed"]
                  assert c.get("/api/requests").json()["count"]==0
                  ws.send_json({"action":"publish_need","capability":"translation","currency":"ETH",
                                "max_budget":0.01,"details":"bad" + chr(0)})
                  assert ws.receive_json()["error"]=="invalid_buyer_request_details"
              counters=c.get("/api/market/stats").json()["events_since_start"]
              assert counters["buyer_studio_views"]>=1 and counters["requests_published"]==1
              assert counters["requests_cancelled"]==1
              assert all(x in app.FEE_WALLETS for x in ("BTC","ETH","SOL","TRX"))
          print("PASS browser buyer funnel, signed real demand, XSS escaping and cancellation, no funds")
          PY
      - name: Verify free Agent Flight Check is honest, bounded and works on both MCP eras
        run: |
          python - <<'PY'
          import json,time
          from fastapi.testclient import TestClient
          import app as m
          with TestClient(m.app) as c:
              sample=c.get("/api/agent/flight-check").json()
              assert sample["sample_input"] is True
              assert sample["live_opportunity"]["match_count"]==0
              assert sample["certification"] is False
              assert sample["identity_verified"] is False
              assert sample["price"]==0 and sample["no_wallet_required"] is True
              assert set(sample["integrate"]["copyable_services_json"])=={"translation","code-review"}
              assert c.get("/api/agent/flight-check?capabilities=foo,bar&currency=SOL").status_code==200
              for args in ("capabilities=foo,%24%28bad%29","capabilities="+",".join(["a"]*9),
                           "currency=USD","capabilities=","capabilities="+("a"*321)):
                  q=c.get("/api/agent/flight-check?"+args)
                  assert q.status_code==422,(args,q.status_code,q.text)
              fake={"id":"local-test-only","buyer":"0x0000000000000000000000000000000000000001",
                    "capability":"translation","currency":"SOL","max_budget":0.01,
                    "created_at":"test","expires_at":"test",
                    "created_monotonic":time.monotonic()}
              m.open_needs[fake["id"]]=fake
              try:
                  report=c.get("/api/agent/flight-check",params={"capabilities":"translation,translation","currency":"SOL"}).json()
                  assert report["live_opportunity"]["match_count"]==1
                  assert report["live_opportunity"]["matches"][0]["id"]=="local-test-only"
                  assert report["live_opportunity"]["funds_reserved"] is False
                  report2=c.get("/api/agent/flight-check",params={"capabilities":"translation","currency":"ETH"}).json()
                  assert report2["live_opportunity"]["match_count"]==0
              finally:
                  m.open_needs.clear()
              headers={"accept":"application/json, text/event-stream",
                       "content-type":"application/json","mcp-protocol-version":"2025-11-25"}
              payload={"jsonrpc":"2.0","id":11,"method":"tools/call",
                       "params":{"name":"agent_flight_check","arguments":{"capabilities":"translation","currency":"ETH"}}}
              legacy=c.post("/mcp",headers=headers,json=payload)
              assert legacy.status_code==200,legacy.text
              assert legacy.json()["result"]["structuredContent"]["no_wallet_required"] is True
              assert "agent_flight_check" in {x["name"] for x in c.post("/mcp",headers=headers,
                    json={"jsonrpc":"2.0","id":12,"method":"tools/list","params":{}}).json()["result"]["tools"]}
              meta={"io.modelcontextprotocol/protocolVersion":"2026-07-28",
                    "io.modelcontextprotocol/clientCapabilities":{}}
              modern=c.post("/mcp",headers={**headers,"mcp-protocol-version":"2026-07-28",
                    "mcp-method":"tools/call","mcp-name":"agent_flight_check"},
                    json={"jsonrpc":"2.0","id":13,"method":"tools/call",
                    "params":{"_meta":meta,"name":"agent_flight_check","arguments":{"capabilities":"translation"}}})
              assert modern.status_code==200,modern.text
              assert modern.json()["result"]["structuredContent"]["live_opportunity"]["match_count"]==0
              assert c.get("/api/market/stats").json()["events_since_start"]["flight_checks"]>=4
              assert "/api/agent/flight-check" in c.get("/sitemap.xml").text
              assert "Agent Flight Check" in c.get("/",headers={"accept":"text/html"}).text
              assert c.get("/api/install").json()["free_agent_flight_check"].endswith("/api/agent/flight-check")
              assert all(x in m.FEE_WALLETS for x in ("BTC","ETH","SOL","TRX"))
          print("PASS free flight check, synthetic-local demand isolation, real-MCP-call, validation, conversion funnel")
          PY
      - name: Validate portable Agent Skill and public zero-auth install
        run: |
          python - <<'PY'
          from pathlib import Path
          from fastapi.testclient import TestClient
          import app
          skill=Path(".agents/skills/ai-market/SKILL.md").read_text("utf-8")
          assert skill.startswith("---\nname: ai-market\n")
          assert len(skill) < 10000
          assert "market_in_one_call" in skill
          assert "Never send a private key" in skill
          with TestClient(app.app) as client:
              assert client.get("/api/agent/now").status_code == 200
              for route in ("/SKILL.md","/skills/ai-market/SKILL.md"):
                  response=client.get(route)
                  assert response.status_code == 200, (route,response.status_code)
                  assert response.text == skill
                  assert "markdown" in response.headers["content-type"]
              manifest=client.get("/.well-known/ai-market.json").json()
              assert manifest["portable_agent_skill"].endswith("/skills/ai-market/SKILL.md")
              installer=client.get("/api/install").json()
              assert installer["mcp_json"]["mcpServers"]["ai-market"]["url"].endswith("/mcp")
              assert installer["portable_skill_cli"]=="npx skills add bracha55555-hue/aimarket --skill ai-market"
              assert installer["no_api_key_required_for_read_only"] is True
              assert installer["connect_any_agent"].endswith("/connect")
              assert client.get("/sitemap.xml").text.count("SKILL.md") == 1
              assert "/skills/ai-market/SKILL.md" in client.get("/llms.txt").text
              import hashlib
              metadata={"io.modelcontextprotocol/protocolVersion":"2026-07-28",
                        "io.modelcontextprotocol/clientCapabilities":{}}
              headers={"content-type":"application/json","accept":"application/json, text/event-stream",
                       "mcp-protocol-version":"2026-07-28"}
              def rpc(method,params,id=1):
                  resp=client.post("/mcp",json={"jsonrpc":"2.0","id":id,"method":method,
                                  "params":{"_meta":metadata,**params}},
                                  headers={**headers,"mcp-method":method})
                  assert resp.status_code==200,(method,resp.status_code,resp.text)
                  return resp.json()["result"]
              discover=rpc("server/discover",{})
              assert "io.modelcontextprotocol/skills" in discover["capabilities"]["extensions"]
              assert "resources" in discover["capabilities"]
              listed=rpc("skills/list",{})
              entry=listed["skills"][0]
              assert entry["frontmatter"]["name"]=="ai-market"
              assert entry["uri"]=="skill://ai-market/SKILL.md"
              resource=entry["resources"][0]
              assert resource["size"]==len(skill.encode("utf-8"))
              assert resource["digest"]=="sha256:"+hashlib.sha256(skill.encode("utf-8")).hexdigest()
              assert rpc("skills/get",{"uri":entry["uri"]})["skill"]==entry
              assert rpc("resources/read",{"uri":entry["uri"]})["contents"][0]["text"]==skill
              assert rpc("resources/list",{})["resources"][0]["uri"]==entry["uri"]
              bad=client.post("/mcp",json={"jsonrpc":"2.0","id":3,"method":"skills/get",
                         "params":{"_meta":metadata,"uri":"skill://wrong/SKILL.md"}},
                         headers={**headers,"mcp-method":"skills/get"})
              assert bad.status_code==400 and bad.json()["error"]["code"]==-32602

          print("PASS standard Agent Skill, same bytes via API, no login, wallets untouched")
          PY
      - name: Test downloaded agent client against a live local WebSocket
        run: |
          python - <<'PY'
          import os, sys, subprocess, tempfile, urllib.request, json, time
          from eth_account import Account
          root="http://127.0.0.1:8897"
          server=subprocess.Popen([sys.executable,"-m","uvicorn","app:app","--host","127.0.0.1","--port","8897"],
                                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          client=None
          try:
              for i in range(90):
                  if server.poll() is not None:raise RuntimeError("Server died")
                  try:
                      urllib.request.urlopen(root+"/health",timeout=1).close()
                      break
                  except Exception:time.sleep(0.2)
              else:raise RuntimeError("Server not ready")
              with urllib.request.urlopen(root+"/client/connect-agent.py",timeout=4) as h:
                  source=h.read().decode("utf-8")
              with tempfile.TemporaryDirectory() as directory:
                  path=os.path.join(directory,"connect-agent.py")
                  with open(path,"w",encoding="utf-8") as h:h.write(source)
                  env=dict(os.environ)
                  env["AIMARKET_WS_URL"]="ws://127.0.0.1:8897/ws/registry"
                  env.pop("AIMARKET_AGENT_PRIVATE_KEY",None)
                  env["AIMARKET_IDENTITY_FILE"]=os.path.join(directory,"identity-only.key")
                  env["AIMARKET_SERVICES"]='{"proofreading":0.01}'
                  client=subprocess.Popen([sys.executable,"-u",path],env=env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  for i in range(90):
                      if client.poll() is not None:raise RuntimeError("Downloadable client exited")
                      with urllib.request.urlopen(root+"/api/market/stats",timeout=2) as h:
                          stats=json.load(h)
                      if stats["authenticated_online_agents"]==1:
                          assert stats["available_service_offers"]==1
                          assert stats["events_since_start"]["registered"]==1
                          assert os.path.isfile(env["AIMARKET_IDENTITY_FILE"])
                          assert (os.stat(env["AIMARKET_IDENTITY_FILE"]).st_mode & 0o077)==0
                          print("Live local WebSocket and downloadable agent client PASS")
                          break
                      time.sleep(0.2)
                  else:raise RuntimeError("Client never registered")
          finally:
              if client is not None:
                  client.terminate()
                  try:client.wait(timeout=3)
                  except subprocess.TimeoutExpired:client.kill()
              server.terminate()
              try:server.wait(timeout=3)
              except subprocess.TimeoutExpired:server.kill()
          PY
      - name: Buyer requests, agent matching and zero-registration discovery
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from eth_account import Account
          from eth_account.messages import encode_defunct
          import app as m
          def login(ws,key,caps,prices):
              ws.send_json({"agent_id":key.address.lower(),"capabilities":caps,"pricing":prices})
              challenge=ws.receive_json()
              assert challenge["event"]=="auth_challenge"
              sign=Account.sign_message(encode_defunct(text=challenge["message"]),key.key).signature.hex()
              ws.send_json({"action":"authenticate","signature":sign})
              assert ws.receive_json()["status"]=="registered"
          buyer=Account.create(); seller=Account.create()
          with TestClient(m.app) as client:
              assert client.get("/api/agent/now").status_code==200
