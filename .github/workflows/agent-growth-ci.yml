name: Agent onboarding and adoption safety
on:
  push:
    branches: [main, growth/agent-frictionless-demand-20261026]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt httpx
      - run: python -m py_compile app.py
      - name: Validate portable Agent Skill and public zero-auth install
        run: |
          python - <<'PY'
          from pathlib import Path
          from fastapi.testclient import TestClient
          import app
          skill=Path(".agents/skills/ai-market/SKILL.md").read_text("utf-8")
          assert skill.startswith("---\nname: ai-market\n")
          assert len(skill) < 10000
          assert "market_in_one_call" in skill
          assert "Never send a private key" in skill
          with TestClient(app.app) as client:
              assert client.get("/api/agent/now").status_code == 200
              for route in ("/SKILL.md","/skills/ai-market/SKILL.md"):
                  response=client.get(route)
                  assert response.status_code == 200, (route,response.status_code)
                  assert response.text == skill
                  assert "markdown" in response.headers["content-type"]
              manifest=client.get("/.well-known/ai-market.json").json()
              assert manifest["portable_agent_skill"].endswith("/skills/ai-market/SKILL.md")
              installer=client.get("/api/install").json()
              assert installer["mcp_json"]["mcpServers"]["ai-market"]["url"].endswith("/mcp")
              assert "gh skill install" in installer["github_cli_skill_install"]
              assert client.get("/sitemap.xml").text.count("SKILL.md") == 1
              assert "/skills/ai-market/SKILL.md" in client.get("/llms.txt").text
          print("PASS standard Agent Skill, same bytes via API, no login, wallets untouched")
          PY
      - name: Test downloaded agent client against a live local WebSocket
        run: |
          python - <<'PY'
          import os, sys, subprocess, tempfile, urllib.request, json, time
          from eth_account import Account
          root="http://127.0.0.1:8897"
          server=subprocess.Popen([sys.executable,"-m","uvicorn","app:app","--host","127.0.0.1","--port","8897"],
                                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          client=None
          try:
              for i in range(90):
                  if server.poll() is not None:raise RuntimeError("Server died")
                  try:
                      urllib.request.urlopen(root+"/health",timeout=1).close()
                      break
                  except Exception:time.sleep(0.2)
              else:raise RuntimeError("Server not ready")
              with urllib.request.urlopen(root+"/client/connect-agent.py",timeout=4) as h:
                  source=h.read().decode("utf-8")
              with tempfile.TemporaryDirectory() as directory:
                  path=os.path.join(directory,"connect-agent.py")
                  with open(path,"w",encoding="utf-8") as h:h.write(source)
                  env=dict(os.environ)
                  env["AIMARKET_WS_URL"]="ws://127.0.0.1:8897/ws/registry"
                  env.pop("AIMARKET_AGENT_PRIVATE_KEY",None)
                  env["AIMARKET_IDENTITY_FILE"]=os.path.join(directory,"identity-only.key")
                  env["AIMARKET_SERVICES"]='{"proofreading":0.01}'
                  client=subprocess.Popen([sys.executable,"-u",path],env=env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  for i in range(90):
                      if client.poll() is not None:raise RuntimeError("Downloadable client exited")
                      with urllib.request.urlopen(root+"/api/market/stats",timeout=2) as h:
                          stats=json.load(h)
                      if stats["authenticated_online_agents"]==1:
                          assert stats["available_service_offers"]==1
                          assert stats["events_since_start"]["registered"]==1
                          assert os.path.isfile(env["AIMARKET_IDENTITY_FILE"])
                          assert (os.stat(env["AIMARKET_IDENTITY_FILE"]).st_mode & 0o077)==0
                          print("Live local WebSocket and downloadable agent client PASS")
                          break
                      time.sleep(0.2)
                  else:raise RuntimeError("Client never registered")
          finally:
              if client is not None:
                  client.terminate()
                  try:client.wait(timeout=3)
                  except subprocess.TimeoutExpired:client.kill()
              server.terminate()
              try:server.wait(timeout=3)
              except subprocess.TimeoutExpired:server.kill()
          PY
      - name: Buyer requests, agent matching and zero-registration discovery
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from eth_account import Account
          from eth_account.messages import encode_defunct
          import app as m
          def login(ws,key,caps,prices):
              ws.send_json({"agent_id":key.address.lower(),"capabilities":caps,"pricing":prices})
              challenge=ws.receive_json()
              assert challenge["event"]=="auth_challenge"
              sign=Account.sign_message(encode_defunct(text=challenge["message"]),key.key).signature.hex()
              ws.send_json({"action":"authenticate","signature":sign})
              assert ws.receive_json()["status"]=="registered"
          buyer=Account.create(); seller=Account.create()
          with TestClient(m.app) as client:
              assert client.get("/api/agent/now").status_code==200
              assert client.get("/api/agent/now").json()["browse_without_wallet"]
              assert client.get("/api/requests").json()["count"]==0
              with client.websocket_connect("/ws/registry") as selling:
                  login(selling,seller,["translation"],{"translation":0.02})
                  with client.websocket_connect("/ws/registry") as buying:
                      login(buying,buyer,[],{})
                      buying.send_json({"action":"publish_need","capability":"translation","currency":"ETH","max_budget":0.03})
                      posted=buying.receive_json()
                      assert posted["event"]=="request_published" and not posted["funds_reserved"]
                      rid=posted["request"]["id"]
                      alert=selling.receive_json()
                      assert alert["event"]=="matching_buyer_request"
                      assert alert["request"]["id"]==rid
                      buying.send_json({"action":"publish_need","capability":"translation","currency":"ETH","max_budget":0.03})
                      duplicate=buying.receive_json()
                      assert duplicate["event"]=="request_published" and duplicate["request"]["id"]==rid and not duplicate["new"]
                      requests=client.get("/api/requests").json()
                      assert requests["count"]==1 and not requests["funds_reserved"]
                      overview=client.get("/api/agent/now?capability=translat").json()
                      assert overview["available_agents_count"]==1
                      assert overview["real_requests_count"]==1
                      buying.send_json({"action":"publish_need","capability":"translation","currency":"ETH","max_budget":False})
                      assert buying.receive_json()["error"]=="invalid_buyer_request"
                      buying.send_json({"action":"publish_need","capability":"translation","currency":[],"max_budget":0.03})
                      assert buying.receive_json()["error"]=="invalid_buyer_request"
                      selling.send_json({"action":"my_matches"})
                      result=selling.receive_json()
                      assert result["event"]=="matching_requests" and len(result["requests"])==1
                      buying.send_json({"action":"cancel_need","request_id":rid})
                      assert buying.receive_json()["removed"]
                      assert client.get("/api/requests").json()["count"]==0
                      buying.send_json({"action":"publish_need","capability":"translation","currency":"BTC","max_budget":0.01})
                      posted=buying.receive_json()
                      assert posted["event"]=="request_published"
                      assert selling.receive_json()["event"]=="matching_buyer_request"
                      m.expire_stale_trades(now=m.open_needs[posted["request"]["id"]]["created_monotonic"]+m.NEED_TTL_SECONDS+1)
                      assert client.get("/api/requests").json()["count"]==0
                      assert client.get("/api/market/stats").json()["events_since_start"]["requests_published"]==2
              assert client.get("/api/market/stats").json()["authenticated_online_agents"]==0
          print("PASS genuine requests and matching without real payments")
          PY
      - name: Test discovery, first-agent onboarding, honest counters and no currency regressions
        run: |
          python - <<'PY'
          import ast, app as m
          from fastapi.testclient import TestClient
          from eth_account import Account
          from eth_account.messages import encode_defunct
          with TestClient(m.app) as c:
              assert c.get('/').status_code == 200
              for head_path in ('/','/health','/.well-known/ai-market.json','/mcp'):
                  assert c.head(head_path).status_code == 200, head_path
              html = c.get('/', headers={'accept':'text/html'})
              assert html.status_code == 200 and '<h1>AI Market' in html.text
              assert '<a href="/client/connect-agent.py">' in html.text
              r = c.get('/robots.txt')
              assert r.status_code == 200 and 'Sitemap:' in r.text
              assert 'sitemap.xml' in r.text
              assert '<urlset' in c.get('/sitemap.xml').text
              assert 'agent' in c.get('/llms.txt').text.lower()
              guide=c.get('/api/onboarding').json()
              assert guide['fee_rate'] == 0.02
              assert guide['websocket'].startswith(('ws://','wss://')) and guide['websocket'].endswith('/ws/registry')
              helper=c.get('/client/connect-agent.py')
              assert helper.status_code == 200
              ast.parse(helper.text)
              assert 'Account.sign_message' in helper.text
              assert 'AIMARKET_AGENT_PRIVATE_KEY' in helper.text
              assert 'send_raw_transaction' not in helper.text
              stats=c.get('/api/market/stats').json()
              assert stats['authenticated_online_agents'] == 0
              assert stats['events_since_start']['registered'] == 0
              agent=Account.create()
              with c.websocket_connect('/ws/registry') as ws:
                  ws.send_json({'agent_id':agent.address.lower(),'capabilities':['translation'],
                                'pricing':{'translation':0.01}})
                  ch=ws.receive_json()
                  assert ch['event']=='auth_challenge'
                  signed=Account.sign_message(encode_defunct(text=ch['message']),agent.key).signature.hex()
                  ws.send_json({'action':'authenticate','signature':signed})
                  welcome=ws.receive_json()
                  assert welcome['status']=='registered' and welcome['identity_verified'] is True
                  stats=c.get('/api/market/stats').json()
                  assert stats['authenticated_online_agents'] == 1
                  assert stats['events_since_start']['registered']==1
                  assert stats['available_service_offers'] == 1
                  catalog=c.get('/api/agents').json()
                  assert catalog['count']==1
                  ws.send_json({'action':'discover','capability':'translation'})
                  assert ws.receive_json()['event']=='discovery_results'
                  assert c.get('/api/market/stats').json()['events_since_start']['discovery_queries']==1
                  ws.send_json({'action':'ping'})
                  assert ws.receive_json()['action']=='pong'
              assert c.get('/api/market/stats').json()['authenticated_online_agents']==0
              assert all(chain in m.FEE_WALLETS for chain in ['BTC','ETH','SOL','TRX'])
              for call in (m.verify_eth_invoice,m.verify_btc_proof,m.verify_solana_payment,m.verify_tron_payment):
                  assert callable(call)
              assert c.get('/api/market/stats').json()['events_since_start']['settlements_verified'] == 0
          print('PASS: onboarding, discovery and counters; no wallet operations')
          PY